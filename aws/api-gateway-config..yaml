openapi: 3.0.1
info:
  title: UserProgressAPI
  description: API para sincronizar el progreso del usuario
  version: '1.0'
paths:
  /user-progress:
    post:
      summary: Guardar progreso del usuario
      operationId: saveUserProgress
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - timestamp
                - progressData
              properties:
                userId:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                progressData:
                  type: object
      responses:
        '200':
          description: Progreso guardado exitosamente
        '400':
          description: Datos inválidos
        '401':
          description: No autorizado
        '500':
          description: Error interno del servidor
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:eu-west-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-1:123456789012:function:saveUserProgress/invocations
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy
  /user-progress/{userId}:
    get:
      summary: Obtener progreso del usuario
      operationId: getUserProgress
      security:
        - CognitoAuth: []
      parameters:
        - name: userId
          in: path
          required: 
        - CognitoAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progreso del usuario obtenido exitosamente
        '400':
          description: ID de usuario inválido
        '401':
          description: No autorizado
        '404':
          description: No se encontraron datos para este usuario
        '500':
          description: Error interno del servidor
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:eu-west-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-1:123456789012:function:getUserProgress/invocations
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy
components:
  securitySchemes:
    CognitoAuth:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - arn:aws:cognito-idp:eu-west-1:123456789012:userpool/eu-west-1_XXXXXXXXX

